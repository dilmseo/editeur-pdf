# Le site est publie par l'API digest depuis le disque, sans build. Cette section
# sert au cas ou le depot serait un jour relie directement a Netlify : les pages
# n'etant plus versionnees, il faudrait alors les reconstruire avant publication.
[build]
  command = "node build-pages.js"
  publish = "."
  functions = "netlify/functions"

# Les deux types sont admis par Google pour un sitemap ; text/xml est celui que
# servent la plupart des sites, et certains outils d'analyse refusent l'autre.
# Autant ne pas laisser cette variable dans l'equation.
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "text/xml; charset=UTF-8"

# Une seule adresse indexée. Le .fr, les www et l'ancienne adresse Netlify
# renvoient vers voilapdf.com en 301, sinon la popularité se disperserait entre
# cinq versions du même site. La redirection depuis editeur-pdf.netlify.app n'a
# été posée qu'une fois le nouveau domaine joignable et son certificat émis.
[[redirects]]
  from = "https://editeur-pdf.netlify.app/*"
  to = "https://voilapdf.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://voilapdf.fr/*"
  to = "https://voilapdf.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.voilapdf.fr/*"
  to = "https://voilapdf.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.voilapdf.com/*"
  to = "https://voilapdf.com/:splat"
  status = 301
  force = true

# Tesseract décompresse lui-même les données de langue avec pako. Si le CDN
# annonçait un Content-Encoding: gzip, le navigateur décompresserait d'abord et
# pako recevrait du texte clair : échec. On fige donc le type en binaire opaque.
[[headers]]
  for = "/vendor/lang/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les résumés destinés aux moteurs de réponse doivent se lire dans le navigateur,
# pas se télécharger.
[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
