[build]
  publish = "."

# Tesseract décompresse lui-même les données de langue avec pako. Si le CDN
# annonçait un Content-Encoding: gzip, le navigateur décompresserait d'abord et
# pako recevrait du texte clair : échec. On fige donc le type en binaire opaque.
[[headers]]
  for = "/vendor/lang/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
